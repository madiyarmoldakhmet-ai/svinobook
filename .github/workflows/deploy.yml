name: Deploy Web

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - run: flutter pub get
      - run: flutter build web --release
      - run: npm install --global firebase-tools
      - run: firebase deploy --only hosting -P svinobook --token "${{ secrets.FIREBASE_TOKEN }}"
