name: svinobook
description: "Svinobook — a modern social & chat experience."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  provider: ^6.1.5+1
  intl: ^0.20.2
  http: ^1.2.2
  image_picker: ^1.2.2
  flutter_webrtc: ^1.2.1
  video_player: ^2.9.5
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^19.4.1
  firebase_messaging: ^16.0.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true